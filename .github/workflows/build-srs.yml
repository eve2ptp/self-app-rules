name: Build rule-set

on:
  push:
    branches:
      - main
    paths:
      - "hk-bank.json"
      - "compile-hk-bank-srs.sh"
      - "clash-meta/build.py"
      - "custom-app/direct.json"
      - "custom-app/proxy.json"
      - "custom-app/build.py"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-srs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install sing-box (latest)
        run: |
          asset=$(curl -fsSL https://api.github.com/repos/SagerNet/sing-box/releases/latest \
            | jq -r '.assets[].browser_download_url' | grep -E 'linux-amd64\.tar\.gz$' | head -n1)
          echo "Downloading $asset"
          curl -fsSL -o /tmp/sing-box.tar.gz "$asset"
          tar -xzf /tmp/sing-box.tar.gz -C /tmp
          sudo install -m 755 /tmp/sing-box-*/sing-box /usr/local/bin/sing-box
          sing-box version

      - name: Compile rule-set
        run: sh compile-hk-bank-srs.sh

      - name: Build bank Clash Meta rule-set
        run: python3 clash-meta/build.py

      - name: Build custom app rule-sets
        run: python3 custom-app/build.py

      - name: Commit generated rule-sets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hk-bank.srs clash-meta/hk-bank.yaml custom-app/direct.srs custom-app/proxy.srs \
            custom-app/clash-meta/direct.yaml custom-app/clash-meta/proxy.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore: rebuild rule-sets"
            git push
          else
            echo "Rule-sets are up to date"
          fi
